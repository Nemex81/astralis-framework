name: Bug report
description: Report a reproducible problem in ASTRALIS Framework
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve ASTRALIS Framework. Do not include credentials, private paths, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a linear, keyboard-accessible sequence of steps.
      placeholder: |
        1. Start with...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ASTRALIS version
      placeholder: For example, 3.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only non-sensitive operating system, runtime, assistive technology, and AI-agent information.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized logs or other useful information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed credentials, private paths, and personal data.
          required: true
